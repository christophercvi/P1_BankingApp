#
# P1_BankingApp runtime configuration
#
# Every property below can be overridden by an environment variable whose name is the
# property name upper-cased with dots replaced by underscores. For example:
#
#   db.postgres.password  ->  DB_POSTGRES_PASSWORD
#
# Precedence: environment variable > -D system property > this file.
# Keep real production credentials in environment variables only.
#

# ---------------------------------------------------------------------------
# Database selection: postgres | mongo
# ---------------------------------------------------------------------------
db.type=postgres

# ---------------------------------------------------------------------------
# PostgreSQL (JDBC)
# ---------------------------------------------------------------------------
db.postgres.url=jdbc:postgresql://127.0.0.1:5432/bankingdb
db.postgres.username=bankapp
db.postgres.password=bankapp_pw

# ---------------------------------------------------------------------------
# MongoDB
# ---------------------------------------------------------------------------
db.mongo.uri=mongodb://127.0.0.1:27017/?replicaSet=rs0
db.mongo.database=bankingdb
db.mongo.connectTimeoutMs=5000
db.mongo.serverSelectionTimeoutMs=5000

# ---------------------------------------------------------------------------
# Banking business rules
# ---------------------------------------------------------------------------
# Minimum balance a savings account must retain after any debit.
bank.savings.minimumBalance=25.00
# Deposit required to open a new account.
bank.account.minimumOpeningDeposit=0.00
# Maximum number of open (non-closed) accounts per customer.
bank.account.maxPerCustomer=5
# Default number of history rows shown by the console.
bank.history.defaultPageSize=25

# ---------------------------------------------------------------------------
# Password hashing (Password4j Argon2id)
# ---------------------------------------------------------------------------
security.argon2.memoryKib=15360
security.argon2.iterations=3
security.argon2.parallelism=1
security.argon2.outputLengthBytes=32

# ---------------------------------------------------------------------------
# Application behaviour
# ---------------------------------------------------------------------------
app.schema.autoInitialize=true
app.name=CCVI Community Bank
